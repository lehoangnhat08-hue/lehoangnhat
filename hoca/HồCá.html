<!DOCTYPE html>
<html>
<head>
    <title>Hồ cá vui nhộn</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="mystyle.css">
</head>

<body class="canh1">

    <h1>Hồ cá vui nhộn</h1>
    <div id="nut">
        <button id="btnDoiCanh">Đổi cảnh nền</button>
        <button id="btnNhac">Phát nhạc</button>
    </div>
    <audio id="nhac" src="music/nhac.mp3" loop></audio>
    <div id="content">
        <div id="shark"><img src="images/shark.png" alt="Cá mập"></div>
        <div id="goldfish"><img src="images/goldFishSchool.png" alt="Đàn cá vàng"></div>
        <div id="faint"><img src="images/faintSchool.png" alt="Đàn cá xanh"></div>
        <div id="turtle"><img src="images/turtle.png" alt="Rùa"></div>
        <div id="diver1"><img src="images/diver1.png" alt="Thợ lặn 1"></div>
        <div id="diver2"><img src="images/diver2.png" alt="Thợ lặn 2"></div>
        <div id="diver3"><img src="images/diver3.png" alt="Thợ lặn 3"></div>
    </div>
    <div id="cat"></div>

    <script src="js/jquery.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
